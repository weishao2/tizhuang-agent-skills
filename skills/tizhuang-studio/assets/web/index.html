<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题庄 · 题库工作台</title><link rel="stylesheet" href="/web/plugin.css"><link rel="stylesheet" href="/web/studio.css"><link rel="stylesheet" href="/web/library.css"><script src="/web/app.js" defer></script><script src="/web/library.js" defer></script><script src="/web/workflow.js" defer></script><link rel="stylesheet" href="/web/workspace.css"><script src="/web/papers.js" defer></script><script src="/web/workspace.js" defer></script></head>
<body class="tz-bank"><div class="app">
<div class="workspace-header"><header class="mast"><a class="brand" href="/#home" title="查看概览" aria-label="题庄题库工作台 · 概览"><img src="/web/logo.svg" alt="题庄"><strong>题库工作台</strong></a><div class="mast-actions"><button data-tab="manage" class="quiet">备份迁移</button><button id="theme-toggle" class="quiet" aria-label="切换深色模式" aria-pressed="false">☾ 深色</button><button id="connect" class="quiet">连接题庄</button></div></header>
<nav class="tabs" aria-label="题库主导航"><button data-tab="library"><span class="step-index">01</span> 我的题目</button><i class="step-arrow" aria-hidden="true">→</i><button data-tab="basket"><span class="step-index">02</span> 组卷 <span id="basket-count">0</span></button><i class="step-arrow" aria-hidden="true">→</i><button data-tab="exports"><span class="step-index">03</span> 我的试卷</button></nav></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<main id="main"></main>
<footer class="footer"><div class="footer-links"><a href="https://tizhuang.qcscience.cc/" target="_blank" rel="noopener">题庄官网 ↗</a><span id="studio-version">v1.0.1</span><button id="skill-update" class="quiet">更新 Skill ↗</button></div><span>本机保存 · <span id="sync" role="status">正在连接工作台</span></span></footer>
</div>
<dialog id="connection"><form id="key-form"><div class="dialog-head"><h2>连接题庄</h2><button type="button" id="close-dialog" class="quiet" aria-label="关闭">×</button></div><p>使用自己的 Key 取题，额度与题庄账户共用。</p><label class="field">API Key<input type="password" id="key" autocomplete="off" placeholder="输入题庄 Key" required></label><p class="muted">Key 仅保留在这次工作台服务的内存中，关闭服务后清除。</p><button class="primary" type="submit">连接并查看额度</button><a href="https://tizhuang.qcscience.cc/account" target="_blank" rel="noopener">到官网获取 Key ↗</a><p id="key-message" role="status"></p></form></dialog>
<dialog id="agent-dialog"><div class="dialog-head"><h2>交给 Agent 继续</h2><button class="quiet" id="close-agent" aria-label="关闭 Agent 指令">×</button></div><p>将下面的指令交给已安装此技能、能运行本机工具的 Agent。它会接着操作当前组卷篮。</p><textarea id="agent-prompt" readonly rows="6" aria-label="Agent 接续指令"></textarea><button class="primary" id="copy-agent">复制指令</button><p id="copy-message" role="status"></p></dialog>
<dialog id="library-dialog"><div class="dialog-head"><h2 id="library-dialog-title"></h2><button type="button" id="close-library" class="quiet" aria-label="关闭">×</button></div><div id="library-dialog-body"></div><p id="library-dialog-message" role="status"></p></dialog>
</body></html>
